[[keyboard.bindings]]
action = "SpawnNewInstance"
key = "Return"
mods = "Control|Shift"

[window]
#decorations = "none"
opacity = 0.95
startup_mode = "Maximized"

[window.dimensions]
columns = 160
lines = 80
